[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }
cc = "1"

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.4", features = [] }
tauri-plugin-log = "2"
tauri-plugin-notification = "2"
# 2.6.2 fails on Linux with rust-ini 0.21.3 (ParseOption fields); see tauri-apps/plugins-workspace#3710
tauri-plugin-deep-link = "=2.6.1"
tauri-plugin-opener = "2.7.2"
tauri-plugin-updater = "2.14.0"
tauri-plugin-process = "2.4.0"
