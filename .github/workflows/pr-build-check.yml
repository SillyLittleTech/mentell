name: PR Build Check

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            app:
              - 'src/**'
              - 'worker/**'
              - 'package.json'
              - 'package-lock.json'
              - 'android/**'
              - 'src-tauri/**'
              - 'vite.config.ts'
              - 'tailwind.config.ts'
              - 'tsconfig.*'
              - '.github/workflows/pr-build-check.yml'
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Pass (No App Changes)
        if: needs.check-changes.outputs.app != 'true'
        run: echo "No application code was changed. Skipping build but marking as passed to satisfy PR requirements."
      - name: Checkout
        uses: actions/checkout@v4
        if: needs.check-changes.outputs.app == 'true'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
        if: needs.check-changes.outputs.app == 'true'

      - name: Install dependencies
        run: |
          npm ci || (sleep 5 && npm ci) || (sleep 10 && npm ci)
        shell: bash
        if: needs.check-changes.outputs.app == 'true'

      # This job only verifies the build compiles; the resulting dist/ is never run,
      # deployed, or installed. Firebase Cloud Sync and AI Search indexing are
      # intentionally left disabled (unset) here so this PR/test build never has
      # credentials for the production cloud services, even if the workflow later
      # gains a step that runs or uploads the build output.
      - name: Build app
        env:
          VITE_BASE: /mentell/
          VITE_ENABLE_WEEKLY_AI_SUMMARY: ${{ vars.VITE_ENABLE_WEEKLY_AI_SUMMARY }}
          VITE_WEEKLY_AI_ENDPOINT: ${{ vars.VITE_WEEKLY_AI_ENDPOINT }}
          VITE_WEEKLY_AI_TOKEN: ${{ secrets.WEEKLY_AI_TOKEN }}
        run: npm run build
        if: needs.check-changes.outputs.app == 'true'
    needs: check-changes
