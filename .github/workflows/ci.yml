name: CI and E2E Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test -- --reporter=json --outputFile=test-results.json
        continue-on-error: true # Let it continue so we can report failures

      - name: Build the app
        run: npm run build:check

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npx playwright test
        env:
          CI: true

      - name: Upload screenshots as artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: e2e-screenshots/
          retention-days: 7

      - name: Write to Job Summary
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            let unitTestsPass = false;
            let unitTestsSummary = "No test results found.";
            try {
              if (fs.existsSync('test-results.json')) {
                const results = JSON.parse(fs.readFileSync('test-results.json', 'utf8'));
                unitTestsPass = results.success;
                unitTestsSummary = `${results.numPassedTests} passed, ${results.numFailedTests} failed.`;
              }
            } catch (e) {
              console.error("Could not parse test results", e);
            }
            const testIcon = unitTestsPass ? "✅" : "❌";

            const summaryBody = `
            ### 📸 Automated Checks Complete!

            **Unit Tests:** ${testIcon} ${unitTestsSummary}

            The E2E suite has successfully run. To view the captured visual states of the app (Desktop and Mobile across Light and Dark mode), please download the \`e2e-screenshots\` artifact attached to this workflow run.
            `;

            await core.summary
              .addRaw(summaryBody)
              .write()

      - name: Comment PR (Simplified)
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');

            let unitTestsPass = false;
            let unitTestsSummary = "No test results found.";
            try {
              if (fs.existsSync('test-results.json')) {
                const results = JSON.parse(fs.readFileSync('test-results.json', 'utf8'));
                unitTestsPass = results.success;
                unitTestsSummary = `${results.numPassedTests} passed, ${results.numFailedTests} failed.`;
              }
            } catch (e) {
              console.error("Could not parse test results", e);
            }
            const testIcon = unitTestsPass ? "✅" : "❌";

            const commentBody = `
            ### 📸 Automated Checks Complete!

            **Unit Tests:** ${testIcon} ${unitTestsSummary}

            The E2E suite has successfully run. To view the captured visual states of the app, please download the \`e2e-screenshots\` artifact attached to this workflow run.
            `;

            // Get existing comments
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            // Find our previous comment (if any). The bot is "github-actions[bot]".
            const botComment = comments.find(comment =>
              comment.user.login === 'github-actions[bot]' && comment.body.includes('Automated Checks Complete!')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: commentBody
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: commentBody
              });
            }
