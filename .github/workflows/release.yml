name: Release Builds

on:
  push:
    branches:
      - main
    paths:
      - src/**
      - worker/**
      - package.json
      - package-lock.json
      - android/**
      - src-tauri/**
      - vite.config.ts
      - tailwind.config.ts
      - tsconfig.*
      - .github/workflows/release.yml
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            app:
              - 'src/**'
              - 'worker/**'
              - 'package.json'
              - 'package-lock.json'
              - 'android/**'
              - 'src-tauri/**'
              - 'vite.config.ts'
              - 'tailwind.config.ts'
              - 'tsconfig.*'
              - '.github/workflows/release.yml'
  build-web-and-android:
    runs-on: ubuntu-latest
    steps:
      - name: Pass (No App Changes)
        if: needs.check-changes.outputs.app != 'true'
        run: echo "No application code was changed. Skipping build but marking as passed to satisfy PR requirements."
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
        if: needs.check-changes.outputs.app == 'true'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
        if: needs.check-changes.outputs.app == 'true'

      - name: Install dependencies
        run: npm ci
        if: needs.check-changes.outputs.app == 'true'

      - name: Build Web App
        env:
          VITE_BASE: /
          VITE_ENABLE_WEEKLY_AI_SUMMARY: ${{ vars.VITE_ENABLE_WEEKLY_AI_SUMMARY }}
          VITE_WEEKLY_AI_ENDPOINT: ${{ vars.VITE_WEEKLY_AI_ENDPOINT }}
          VITE_WEEKLY_AI_TOKEN: ${{ secrets.WEEKLY_AI_TOKEN }}
          VITE_ENABLE_PROJECTOR_AI_SEARCH: ${{ vars.VITE_ENABLE_PROJECTOR_AI_SEARCH }}
          VITE_PROJECTOR_SEARCH_ENDPOINT: ${{ vars.VITE_PROJECTOR_SEARCH_ENDPOINT }}
          VITE_PROJECTOR_SEARCH_TOKEN: ${{ secrets.WEEKLY_AI_TOKEN }}
          VITE_ENABLE_PJS_CLOSECONF: ${{ vars.VITE_ENABLE_PJS_CLOSECONF }}
          VITE_VAPID_PUBLIC_KEY: ${{ vars.VITE_VAPID_PUBLIC_KEY }}
          VITE_PUSH_API_BASE: ${{ vars.VITE_PUSH_API_BASE }}
          VITE_FEEDBACK_FORM_ENDPOINT: ${{ vars.VITE_FEEDBACK_FORM_ENDPOINT }}
          VITE_FEEDBACK_TURNSTILE_SITE_KEY: ${{ vars.VITE_FEEDBACK_TURNSTILE_SITE_KEY }}
          VITE_ENABLE_FIREBASE: ${{ vars.VITE_ENABLE_FIREBASE }}
          VITE_ENABLE_FIREBASE_SYNC: ${{ vars.VITE_ENABLE_FIREBASE_SYNC }}
          VITE_ENABLE_SHARE_LINKS: ${{ vars.VITE_ENABLE_SHARE_LINKS }}
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
        run: npm run build
        if: needs.check-changes.outputs.app == 'true'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'
        if: needs.check-changes.outputs.app == 'true'

      - name: Build Android APK
        run: |
          npx cap sync android
          cd android
          ./gradlew --no-daemon assembleDebug --stacktrace --info
          cd ..
        if: needs.check-changes.outputs.app == 'true'

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: mentell-android
          path: android/app/build/outputs/apk/debug/app-debug.apk
        if: needs.check-changes.outputs.app == 'true'

      - name: Build Offline ZIP
        env:
          VITE_ENABLE_WEEKLY_AI_SUMMARY: ${{ vars.VITE_ENABLE_WEEKLY_AI_SUMMARY }}
          VITE_WEEKLY_AI_ENDPOINT: ${{ vars.VITE_WEEKLY_AI_ENDPOINT }}
          VITE_WEEKLY_AI_TOKEN: ${{ secrets.WEEKLY_AI_TOKEN }}
          VITE_ENABLE_PROJECTOR_AI_SEARCH: ${{ vars.VITE_ENABLE_PROJECTOR_AI_SEARCH }}
          VITE_PROJECTOR_SEARCH_ENDPOINT: ${{ vars.VITE_PROJECTOR_SEARCH_ENDPOINT }}
          VITE_PROJECTOR_SEARCH_TOKEN: ${{ secrets.WEEKLY_AI_TOKEN }}
          VITE_ENABLE_PJS_CLOSECONF: ${{ vars.VITE_ENABLE_PJS_CLOSECONF }}
          VITE_FEEDBACK_FORM_ENDPOINT: ${{ vars.VITE_FEEDBACK_FORM_ENDPOINT }}
          VITE_FEEDBACK_TURNSTILE_SITE_KEY: ${{ vars.VITE_FEEDBACK_TURNSTILE_SITE_KEY }}
          VITE_ENABLE_FIREBASE: ${{ vars.VITE_ENABLE_FIREBASE }}
          VITE_ENABLE_FIREBASE_SYNC: ${{ vars.VITE_ENABLE_FIREBASE_SYNC }}
          VITE_ENABLE_SHARE_LINKS: ${{ vars.VITE_ENABLE_SHARE_LINKS }}
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
        run: npm run build:offline-zip
        if: needs.check-changes.outputs.app == 'true'

      - name: Package Web ZIP
        run: |
          rm -rf mentell-offline
          mkdir -p mentell-offline
          cp -r dist/. mentell-offline/
          printf '%s\n' 'Open index.html in your browser for offline use (double-click or drag into a browser window).' 'Routes use hash URLs (e.g. index.html#/settings).' 'This build inlines assets so file:// works without a local server.' > mentell-offline/README.txt
          cd mentell-offline && zip -r ../mentell-web.zip .
        if: needs.check-changes.outputs.app == 'true'

      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mentell-web
          path: mentell-web.zip
        if: needs.check-changes.outputs.app == 'true'
    needs: check-changes

  build-tauri:
    strategy:
      fail-fast: false
      matrix:
        platform: [ macos-latest, ubuntu-latest, windows-latest ]
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Pass (No App Changes)
        if: needs.check-changes.outputs.app != 'true'
        run: echo "No application code was changed. Skipping build but marking as passed to satisfy PR requirements."
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
        if: needs.check-changes.outputs.app == 'true'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
        if: needs.check-changes.outputs.app == 'true'

      - name: Install dependencies
        run: npm ci
        if: needs.check-changes.outputs.app == 'true'

      - name: Install Linux dependencies
        if: needs.check-changes.outputs.app == 'true' && (matrix.platform == 'ubuntu-latest')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        if: needs.check-changes.outputs.app == 'true'

      - name: Build Web App
        env:
          VITE_BASE: /
          VITE_TAURI: 1
          VITE_NATIVE_AUTH_CONTINUE_URL: ${{ vars.VITE_NATIVE_AUTH_CONTINUE_URL }}
          VITE_ENABLE_WEEKLY_AI_SUMMARY: ${{ vars.VITE_ENABLE_WEEKLY_AI_SUMMARY }}
          VITE_WEEKLY_AI_ENDPOINT: ${{ vars.VITE_WEEKLY_AI_ENDPOINT }}
          VITE_WEEKLY_AI_TOKEN: ${{ secrets.WEEKLY_AI_TOKEN }}
          VITE_ENABLE_PROJECTOR_AI_SEARCH: ${{ vars.VITE_ENABLE_PROJECTOR_AI_SEARCH }}
          VITE_PROJECTOR_SEARCH_ENDPOINT: ${{ vars.VITE_PROJECTOR_SEARCH_ENDPOINT }}
          VITE_PROJECTOR_SEARCH_TOKEN: ${{ secrets.WEEKLY_AI_TOKEN }}
          VITE_ENABLE_PJS_CLOSECONF: ${{ vars.VITE_ENABLE_PJS_CLOSECONF }}
          VITE_VAPID_PUBLIC_KEY: ${{ vars.VITE_VAPID_PUBLIC_KEY }}
          VITE_PUSH_API_BASE: ${{ vars.VITE_PUSH_API_BASE }}
          VITE_FEEDBACK_FORM_ENDPOINT: ${{ vars.VITE_FEEDBACK_FORM_ENDPOINT }}
          VITE_FEEDBACK_TURNSTILE_SITE_KEY: ${{ vars.VITE_FEEDBACK_TURNSTILE_SITE_KEY }}
          VITE_ENABLE_FIREBASE: ${{ vars.VITE_ENABLE_FIREBASE }}
          VITE_ENABLE_FIREBASE_SYNC: ${{ vars.VITE_ENABLE_FIREBASE_SYNC }}
          VITE_ENABLE_SHARE_LINKS: ${{ vars.VITE_ENABLE_SHARE_LINKS }}
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
        run: npm run build
        if: needs.check-changes.outputs.app == 'true'

      - name: Build Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_BASE: /
          VITE_TAURI: 1
          VITE_NATIVE_AUTH_CONTINUE_URL: ${{ vars.VITE_NATIVE_AUTH_CONTINUE_URL }}
          VITE_ENABLE_WEEKLY_AI_SUMMARY: ${{ vars.VITE_ENABLE_WEEKLY_AI_SUMMARY }}
          VITE_WEEKLY_AI_ENDPOINT: ${{ vars.VITE_WEEKLY_AI_ENDPOINT }}
          VITE_WEEKLY_AI_TOKEN: ${{ secrets.WEEKLY_AI_TOKEN }}
          VITE_ENABLE_PROJECTOR_AI_SEARCH: ${{ vars.VITE_ENABLE_PROJECTOR_AI_SEARCH }}
          VITE_PROJECTOR_SEARCH_ENDPOINT: ${{ vars.VITE_PROJECTOR_SEARCH_ENDPOINT }}
          VITE_PROJECTOR_SEARCH_TOKEN: ${{ secrets.WEEKLY_AI_TOKEN }}
          VITE_ENABLE_PJS_CLOSECONF: ${{ vars.VITE_ENABLE_PJS_CLOSECONF }}
          VITE_VAPID_PUBLIC_KEY: ${{ vars.VITE_VAPID_PUBLIC_KEY }}
          VITE_PUSH_API_BASE: ${{ vars.VITE_PUSH_API_BASE }}
          VITE_FEEDBACK_FORM_ENDPOINT: ${{ vars.VITE_FEEDBACK_FORM_ENDPOINT }}
          VITE_FEEDBACK_TURNSTILE_SITE_KEY: ${{ vars.VITE_FEEDBACK_TURNSTILE_SITE_KEY }}
          VITE_ENABLE_FIREBASE: ${{ vars.VITE_ENABLE_FIREBASE }}
          VITE_ENABLE_FIREBASE_SYNC: ${{ vars.VITE_ENABLE_FIREBASE_SYNC }}
          VITE_ENABLE_SHARE_LINKS: ${{ vars.VITE_ENABLE_SHARE_LINKS }}
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
        with:
          releaseId: 'ignore' # Skip default release logic
        if: needs.check-changes.outputs.app == 'true'

      - name: Upload Tauri Artifacts (macOS)
        if: needs.check-changes.outputs.app == 'true' && (matrix.platform == 'macos-latest')
        uses: actions/upload-artifact@v4
        with:
          name: mentell-macos
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app

      - name: Upload Tauri Artifacts (Linux)
        if: needs.check-changes.outputs.app == 'true' && (matrix.platform == 'ubuntu-latest')
        uses: actions/upload-artifact@v4
        with:
          name: mentell-linux
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage

      - name: Upload Tauri Artifacts (Windows)
        if: needs.check-changes.outputs.app == 'true' && (matrix.platform == 'windows-latest')
        uses: actions/upload-artifact@v4
        with:
          name: mentell-windows
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
    needs: check-changes

  create-release:
    needs: [ build-web-and-android, build-tauri, check-changes ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Pass (No App Changes)
        if: needs.check-changes.outputs.app != 'true'
        run: echo "No application code was changed. Skipping build but marking as passed to satisfy PR requirements."
      - uses: actions/checkout@v4
        if: needs.check-changes.outputs.app == 'true'

      - name: Get Version
        id: version
        run: echo "VERSION=$(cat VERSION)" >> $GITHUB_OUTPUT
        if: needs.check-changes.outputs.app == 'true'

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
        if: needs.check-changes.outputs.app == 'true'

      - name: Determine Release Info
        id: release_info
        run: |
          TIMESTAMP=$(date +'%Y%m%d%H%M%S')
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "TAG_NAME=v${{ steps.version.outputs.VERSION }}-pr${{ github.event.number }}-run${{ github.run_id }}-${TIMESTAMP}" >> $GITHUB_OUTPUT
            echo "IS_PRERELEASE=true" >> $GITHUB_OUTPUT
          else
            echo "TAG_NAME=v${{ steps.version.outputs.VERSION }}-${TIMESTAMP}" >> $GITHUB_OUTPUT
            echo "IS_PRERELEASE=false" >> $GITHUB_OUTPUT
          fi
        if: needs.check-changes.outputs.app == 'true'

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.TAG_NAME }}
          prerelease: ${{ steps.release_info.outputs.IS_PRERELEASE }}
          generate_release_notes: true
          files: |
            ./artifacts/mentell-web/mentell-web.zip
            ./artifacts/mentell-android/app-debug.apk
            ./artifacts/mentell-macos/**/*.dmg
            ./artifacts/mentell-linux/**/*.AppImage
            ./artifacts/mentell-linux/**/*.deb
            ./artifacts/mentell-windows/**/*.msi
            ./artifacts/mentell-windows/**/*.exe
        if: needs.check-changes.outputs.app == 'true'
