name: PR Automation & Approvals

on:
  workflow_run:
    workflows:
      - "benchmark"
      - "build-tauri"
      - "build-web-and-android"
      - "check-changes"
      - "PR Build Check"
    types:
      - requested
  pull_request:
    types: [opened, synchronize]

permissions:
  actions: write
  contents: write

jobs:
  # Job 1: Auto-approve pending CI runs if PR author is trusted
  auto-approve-run:
    if: github.event_name == 'workflow_run'
    runs-on: ubuntu-latest
    steps:
      - name: Check PR Author & Approve
        run: |
          # Get the PR number associated with this workflow run
          PR_NUMBER=$(gh api "/repos/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}" --jq '.pull_requests[0].number')
          
          if [ -z "$PR_NUMBER" ] || [ "$PR_NUMBER" = "null" ]; then
            echo "Not a pull request run. Skipping."
            exit 0
          fi

          # Fetch author info for the PR creator
          PR_AUTHOR_ROLE=$(gh api "/repos/${{ github.repository }}/pulls/$PR_NUMBER" --jq '.author_association')
          PR_AUTHOR_LOGIN=$(gh api "/repos/${{ github.repository }}/pulls/$PR_NUMBER" --jq '.user.login')

          echo "PR #$PR_NUMBER opened by $PR_AUTHOR_LOGIN with role: $PR_AUTHOR_ROLE"

          # Check if the PR author is trusted OR if it's Dependabot
          if [[ "$PR_AUTHOR_ROLE" =~ ^(OWNER|MEMBER|COLLABORATOR|CONTRIBUTOR)$ ]] || [[ "$PR_AUTHOR_LOGIN" == "dependabot[bot]" ]]; then
            echo "PR author is trusted! Approving workflow run..."
            gh api \
              --method POST \
              -H "Accept: application/vnd.github+json" \
              "/repos/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}/approve"
          else
            echo "PR author is untrusted ($PR_AUTHOR_ROLE). Approval withheld."
          fi
        env:
          GH_TOKEN: ${{ secrets.REPO_ADMIN_PAT }}

  # Job 2: Auto-resolve screenshot conflicts in (ee) folder
  resolve-screenshot-conflicts:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Verify trusted author
        if: |
          contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR", "CONTRIBUTOR"]'), github.event.pull_request.author_association) ||
          github.event.pull_request.user.login == 'dependabot[bot]'
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.REPO_ADMIN_PAT }}
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Merge Base & Auto-resolve Screenshots
        if: |
          contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR", "CONTRIBUTOR"]'), github.event.pull_request.author_association) ||
          github.event.pull_request.user.login == 'dependabot[bot]'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git fetch origin ${{ github.base_ref }}
          
          if ! git merge origin/${{ github.base_ref }} --no-commit --no-ff; then
            echo "Merge conflicts detected, resolving screenshot paths..."
            
            git checkout --theirs "(ee)/**/*.png" || true
            git add "(ee)/**/*.png"
            
            # Abort if code files are also conflicting
            if git diff --name-only --diff-filter=U | grep -q .; then
              echo "Non-screenshot conflicts found. Aborting auto-merge."
              git merge --abort
              exit 0
            fi
            
            git commit -m "chore: auto-resolve screenshot conflicts in (ee)"
            git push origin ${{ github.head_ref }}
          else
            echo "No conflicts found."
          fi
        env:
          GH_TOKEN: ${{ secrets.REPO_ADMIN_PAT }}
