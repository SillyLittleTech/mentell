name: Auto-Approve Builds

on:
  workflow_run:
    workflows:
      - "benchmark"
      - "build-tauri"
      - "build-web-and-android"
      - "check-changes"
      - "PR Build Check"
    types:
      - requested

permissions:
  contents: read

jobs:
  approve:
    runs-on: ubuntu-latest
    steps:
      - name: Check PR Author & Approve
        run: |
          PR_NUMBER=$(gh api "/repos/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}" --jq '.pull_requests[0].number')
          
          if [ -z "$PR_NUMBER" ] || [ "$PR_NUMBER" = "null" ]; then
            echo "Not a PR run. Skipping."
            exit 0
          fi

          PR_AUTHOR_ROLE=$(gh api "/repos/${{ github.repository }}/pulls/$PR_NUMBER" --jq '.author_association')
          PR_AUTHOR_LOGIN=$(gh api "/repos/${{ github.repository }}/pulls/$PR_NUMBER" --jq '.user.login')

          echo "PR #$PR_NUMBER opened by $PR_AUTHOR_LOGIN ($PR_AUTHOR_ROLE)"

          if [[ "$PR_AUTHOR_ROLE" =~ ^(OWNER|MEMBER|COLLABORATOR|CONTRIBUTOR)$ ]] || [[ "$PR_AUTHOR_LOGIN" == "dependabot[bot]" ]]; then
            echo "PR author is trusted! Approving workflow..."
            gh api \
              --method POST \
              -H "Accept: application/vnd.github+json" \
              "/repos/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}/approve"
          fi
        env:
          GH_TOKEN: ${{ secrets.REPO_ADMIN_PAT }}
